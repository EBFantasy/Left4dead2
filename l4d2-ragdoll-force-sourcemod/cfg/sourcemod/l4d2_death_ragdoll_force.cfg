// ConVars for plugin "l4d2_death_ragdoll_force.smx"
// Tuned for visible death-only knockback on shotgun/AWP kills.

// Enable death-only ragdoll force.
l4d2_ragdoll_force_enable "1"

// Base force for shotgun death ragdolls.
l4d2_ragdoll_force_shotgun "7800.0"

// Base force for AWP death ragdolls.
l4d2_ragdoll_force_awp "9800.0"

// Force multiplier for hunter and jockey ragdolls.
l4d2_ragdoll_force_hunter_jockey_mult "2.20"

// Force multiplier for smoker, boomer, spitter, and witch ragdolls.
l4d2_ragdoll_force_medium_mult "1.55"

// Vertical lift multiplier applied to the death ragdoll force.
l4d2_ragdoll_force_up_mult "0.24"

// How much vertical shot direction contributes to ragdoll force.
l4d2_ragdoll_force_aim_z_mult "0.70"

// Scale applied to SDKHooks damageForce.
l4d2_ragdoll_force_damageforce_scale "6.0"

// Apply a short velocity to the victim on the lethal damage frame.
l4d2_ragdoll_force_predeath_push "1"

// Scale for lethal-frame victim velocity.
l4d2_ragdoll_force_predeath_velocity_scale "0.28"

// Also try to push a spawned server-side ragdoll entity, if L4D2 exposes one.
l4d2_ragdoll_force_entity_push "1"

// Scale applied when converting damage force to ragdoll entity velocity.
l4d2_ragdoll_force_entity_velocity_scale "0.32"

// Maximum distance for matching a newly spawned ragdoll to a recent kill.
l4d2_ragdoll_force_match_radius "420.0"

// Print ragdoll force debug lines to the server console.
l4d2_ragdoll_force_debug "0"
